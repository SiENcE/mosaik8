[[script]]
name = "main"
[[script.events]]
event = "stop"


[[script]]
name = "bump"
[[script.events]]
event = "set_var"
var = "mark"
expr = "mark + 1"

[[script.events]]
event = "player_setpos"
x = "8 + mark * 8"
y = 64

[[script.events]]
event = "stop"


[[script]]
name = "reset"
[[script.events]]
event = "set_var"
var = "mark"
value = 0

[[script.events]]
event = "player_setpos"
x = "8 + mark * 8"
y = 64

[[script.events]]
event = "stop"


