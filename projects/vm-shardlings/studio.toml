[player]
width = 16
height = 16

[scenes]
glyph_text = true
fade = 4
letterbox = true

[emotes]
sheets = [ "emote_exclaim",]

[scene_layout]
tessel = [ 194, 0,]

[animations.player]
default_state = "walk"

[animations.player.walk]
period = 8
down = [ "player_down0", "player_down1",]
up = [ "player_up0", "player_up1",]
left = [ "player_right0", "player_right1",]
right = [ "player_right0", "player_right1",]
flip_left = true

