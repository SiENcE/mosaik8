[[script]]
name = "menu_items"
[[script.events]]
event = "label"
name = "it_top"

[[script.events]]
event = "say"
ref = "menu_item_counts"

[[script.events]]
event = "menu"
var = "pick"
cancel_b = 1
options = [ "POTION", "SHARD", "BACK",]

[[script.events]]
event = "if"
cond = "pick == 0 and pa_sp == 255"
[[script.events.then]]
event = "say"
ref = "menu_no_starter"

[[script.events.then]]
event = "goto"
name = "it_top"


[[script.events]]
event = "if"
cond = "pick == 0 and it_potion == 0"
[[script.events.then]]
event = "say"
ref = "menu_no_potions"

[[script.events.then]]
event = "goto"
name = "it_top"


[[script.events]]
event = "if"
cond = "pick == 0"
[[script.events.then]]
event = "set_var"
var = "q_sp"
expr = "pa_sp"

[[script.events.then]]
event = "set_var"
var = "q_lv"
expr = "pa_lv"

[[script.events.then]]
event = "call"
script = "sp_stats"

[[script.events.then]]
event = "if"
cond = "pa_hp >= q_mhp"
[[script.events.then.then]]
event = "say"
ref = "menu_hp_full"

[[script.events.then.then]]
event = "goto"
name = "it_top"


[[script.events.then]]
event = "set_var"
var = "pa_hp"
expr = "min(q_mhp, pa_hp + 20)"

[[script.events.then]]
event = "set_var"
var = "it_potion"
expr = "it_potion - 1"

[[script.events.then]]
event = "set_var"
var = "q_hp"
expr = "pa_hp"

[[script.events.then]]
event = "say"
ref = "menu_potion_used"

[[script.events.then]]
event = "goto"
name = "it_top"


[[script.events]]
event = "if"
cond = "pick == 1"
[[script.events.then]]
event = "say"
ref = "menu_shard_info"

[[script.events.then]]
event = "goto"
name = "it_top"


[[script.events]]
event = "ret"

[[script]]
name = "menu_trainer"
[[script.events]]
event = "set_var"
var = "q_n"
value = 0

[[script.events]]
event = "set_var"
var = "q_i"
value = 0

[[script.events]]
event = "while"
cond = "q_i < 16"
[[script.events.then]]
event = "if"
cond = "(seen & (1 << q_i)) != 0"
[[script.events.then.then]]
event = "set_var"
var = "q_n"
expr = "q_n + 1"


[[script.events.then]]
event = "set_var"
var = "q_i"
expr = "q_i + 1"


[[script.events]]
event = "set_var"
var = "q_own"
expr = "(pa_sp != 255) + (pb_sp != 255) + (pc_sp != 255)"

[[script.events]]
event = "say"
ref = "menu_trainer"

[[script.events]]
event = "ret"

[[script]]
name = "menu_watch"
[[script.events]]
event = "label"
name = "mw_top"

[[script.events]]
event = "wait_until"
cond = "held_start() == 1 and ui_open() == 0"

[[script.events]]
event = "call"
script = "pause_menu"

[[script.events]]
event = "wait_until"
cond = "held_start() == 0"

[[script.events]]
event = "goto"
name = "mw_top"
