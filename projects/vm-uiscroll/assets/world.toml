# THE TWO STILL MARKERS (B1). The box is bottom-anchored and the two screens
# are 144 and 192 px tall, so one y cannot sit in both bands: the Game Gear
# box is screen rows 15..17 and the SMS box rows 21..23. Each marker lands in
# its own console's box TEXT row, past the end of "SCROLL HOLD TEST" (16
# chars), i.e. over blank paper - which is what lets the check assert "this
# rectangle is uniform paper while the box is up" with no control ROM. The
# other marker is off-window on that console and parks itself.
[[scene.object]]
kind = "marker"
x = 140
y = 128
id = 1

